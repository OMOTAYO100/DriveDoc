# Netlify build + routing for the DriveDoc frontend.
# Committed so a rebuild never depends on remembering dashboard settings.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy the API through this origin so the auth cookie stays first-party.
# Hitting the Render URL directly makes it a third-party cookie, which
# browsers increasingly block.
[[redirects]]
  from = "/api/*"
  to = "https://drivedoc-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Single-page app: every other path serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# The service worker must never be served stale, or users get stuck on an old
# push handler.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed build assets are immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
