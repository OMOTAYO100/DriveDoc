name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Fail if any question image is served over http
        run: |
          if grep -q 'http://' src/testData.json; then
            echo "Insecure image URLs found — browsers block these as mixed content."
            exit 1
          fi
